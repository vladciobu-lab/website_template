<svg xmlns="http://www.w3.org/2000/svg" viewBox="-170 -42 1140 684" width="1140" height="684">
  <rect x="-100" y="0" width="1000" height="600" fill="#f5f0e8"/>

  <!-- Floor tile grid - bedroom area (right + bottom) -->
  <line x1="310" y1="150" x2="720" y2="150" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="310" y1="240" x2="720" y2="240" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="80"  y1="400" x2="720" y2="400" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="80"  y1="470" x2="720" y2="470" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="490" y1="60"  x2="490" y2="540" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="605" y1="60"  x2="605" y2="540" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="375" y1="320" x2="375" y2="540" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- BAIE floor tiles -->
  <line x1="80"  y1="170" x2="310" y2="170" stroke="#c4b89a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80"  y1="250" x2="310" y2="250" stroke="#c4b89a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="195" y1="60"  x2="195" y2="320" stroke="#c4b89a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Outer wall -->
  <rect x="80" y="60" width="640" height="480" fill="none" stroke="#3a2e1e" stroke-width="5" stroke-linejoin="round"/>

  <!-- ===== WINDOW (Geam) on top outer wall, right portion ===== -->
  <rect x="490" y="53" width="170" height="13" fill="#f5f0e8"/>
  <rect x="490" y="60" width="170" height="48" fill="#ddeef5" stroke="#3a2e1e" stroke-width="2.5"/>
  <line x1="575" y1="60" x2="575" y2="108" stroke="#3a2e1e" stroke-width="1.5"/>
  <line x1="490" y1="84" x2="660" y2="84" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Window sill -->
  <rect x="478" y="106" width="194" height="11" fill="#e8dfc8" stroke="#3a2e1e" stroke-width="2"/>
  <!-- Curtains -->
  <path d="M490,60 Q472,84 485,108" fill="#e8d5b5" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M660,60 Q678,84 665,108" fill="#e8d5b5" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- ===== INNER PARTITION WALLS (BAIE) ===== -->
  <!-- Vertical inner wall: x=310, y=60 to y=240 (solid) -->
  <line x1="310" y1="60" x2="310" y2="235" stroke="#3a2e1e" stroke-width="5"/>
  <!-- Horizontal inner wall: x=80 to x=310, y=320 -->
  <line x1="80" y1="320" x2="310" y2="320" stroke="#3a2e1e" stroke-width="5"/>

  <!-- Usa comunicare: gap y=235 to y=320 in vertical wall at x=310 -->
  <!-- Dashed ghost line for closed door position -->
  <line x1="310" y1="235" x2="310" y2="320" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.35"/>
  <!-- Door swing arc (hinge at 310,235, opens into bedroom, radius=85) -->
  <path d="M310,320 A85,85 0 0,1 395,235" fill="none" stroke="#3a2e1e" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Door knob -->
  <circle cx="317" cy="243" r="3.5" fill="#3a2e1e"/>

  <!-- ===== BATHROOM FIXTURES (inside BAIE: 80-310, 60-320) ===== -->
  <!-- Toilet: against outer top wall, left corner -->
  <!-- Tank -->
  <rect x="88" y="68" width="58" height="24" rx="3" fill="#e8e8e0" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Bowl -->
  <ellipse cx="117" cy="122" rx="28" ry="22" fill="#e8e8e0" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Seat ring -->
  <ellipse cx="117" cy="122" rx="22" ry="17" fill="none" stroke="#3a2e1e" stroke-width="1" opacity="0.6"/>

  <!-- Sink: against inner horizontal wall (top of y=320), inside BAIE -->
  <rect x="145" y="256" width="110" height="58" rx="9" fill="#e8e8e0" stroke="#3a2e1e" stroke-width="1.5"/>
  <ellipse cx="200" cy="285" rx="23" ry="16" fill="none" stroke="#3a2e1e" stroke-width="1"/>
  <circle cx="200" cy="285" r="3.5" fill="none" stroke="#3a2e1e" stroke-width="1"/>
  <!-- Faucet -->
  <rect x="196" y="256" width="9" height="8" rx="1" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1"/>


  <!-- ===== EXIT DOOR (Usa iesire) on right outer wall, bottom ===== -->
  <!-- Gap in wall -->
  <rect x="712" y="405" width="14" height="120" fill="#f5f0e8"/>
  <!-- Dashed door ghost -->
  <line x1="720" y1="405" x2="720" y2="525" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.35"/>
  <!-- Door arc: hinge at (720,405), opens inward (left), radius=120 -->
  <path d="M720,525 A120,120 0 0,0 600,405" fill="none" stroke="#3a2e1e" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Door knob -->
  <circle cx="715" cy="413" r="3.5" fill="#3a2e1e"/>

  <!-- ===== BED (PAT) rotated toward door — headboard on RIGHT ===== -->
  <g transform="rotate(90, 196, 421)">
  <!-- Bed frame (narrower to fit nightstands on both sides) -->
  <rect x="120" y="334" width="152" height="192" rx="7" fill="#e8dfc8" stroke="#3a2e1e" stroke-width="3"/>
  <!-- Headboard at BOTTOM (against lower area) -->
  <rect x="120" y="498" width="152" height="28" rx="5" fill="#c4a87a" stroke="#3a2e1e" stroke-width="2.5"/>
  <!-- Headboard detail lines -->
  <line x1="142" y1="503" x2="142" y2="521" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="164" y1="503" x2="164" y2="521" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="186" y1="503" x2="186" y2="521" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="208" y1="503" x2="208" y2="521" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="230" y1="503" x2="230" y2="521" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="252" y1="503" x2="252" y2="521" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <!-- Duvet / cover -->
  <rect x="128" y="336" width="136" height="162" rx="6" fill="#f0ebe0" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Duvet fold near TOP (footboard end) -->
  <path d="M128,378 Q196,370 264,378" fill="none" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Duvet stitching -->
  <line x1="196" y1="378" x2="196" y2="494" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <line x1="128" y1="436" x2="264" y2="436" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <!-- Pillows near BOTTOM (headboard end) -->
  <rect x="130" y="456" width="58" height="38" rx="8" fill="#fff9f0" stroke="#3a2e1e" stroke-width="2"/>
  <rect x="204" y="456" width="58" height="38" rx="8" fill="#fff9f0" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="159" y1="461" x2="159" y2="489" stroke="#ddd0bb" stroke-width="1"/>
  <line x1="233" y1="461" x2="233" y2="489" stroke="#ddd0bb" stroke-width="1"/>
  <!-- Bed legs at TOP (footboard end) -->
  <rect x="121" y="335" width="12" height="10" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1.5"/>
  <rect x="259" y="335" width="12" height="10" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- ===== NIGHTSTAND STANGA (left of bed, against outer left wall) ===== -->
  <rect x="82" y="462" width="34" height="58" rx="3" fill="#d4c8a8" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="82" y1="491" x2="116" y2="491" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="99" cy="476" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="99" cy="506" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Lamp stanga -->
  <line x1="99" y1="462" x2="99" y2="433" stroke="#3a2e1e" stroke-width="2"/>
  <ellipse cx="99" cy="424" rx="22" ry="10" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M77,424 Q99,442 121,424" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- ===== NIGHTSTAND DREAPTA (right of bed) ===== -->
  <rect x="276" y="462" width="34" height="58" rx="3" fill="#d4c8a8" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="276" y1="491" x2="310" y2="491" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="293" cy="476" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="293" cy="506" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Lamp dreapta -->
  <line x1="293" y1="462" x2="293" y2="433" stroke="#3a2e1e" stroke-width="2"/>
  <ellipse cx="293" cy="424" rx="22" ry="10" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M271,424 Q293,442 315,424" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>

  </g>

  <!-- Sketch texture strokes (hand-drawn feel) -->
  <line x1="82"  y1="62"  x2="84"  y2="538" stroke="#3a2e1e" stroke-width="1.5" opacity="0.3"/>
  <line x1="718" y1="62"  x2="716" y2="538" stroke="#3a2e1e" stroke-width="1.5" opacity="0.3"/>

</svg>
