<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <!-- Land background -->
  <rect width="560" height="380" fill="#f0ece2"/>

  <!-- Sea -->
  <rect x="458" y="0" width="102" height="380" fill="#b8dff0"/>
  <!-- Sea shimmer lines -->
  <line x1="470" y1="60"  x2="555" y2="60"  stroke="#a0cce0" stroke-width="1" opacity="0.6"/>
  <line x1="468" y1="110" x2="555" y2="110" stroke="#a0cce0" stroke-width="1" opacity="0.6"/>
  <line x1="472" y1="160" x2="555" y2="160" stroke="#a0cce0" stroke-width="1" opacity="0.6"/>
  <line x1="470" y1="210" x2="555" y2="210" stroke="#a0cce0" stroke-width="1" opacity="0.6"/>
  <line x1="468" y1="260" x2="555" y2="260" stroke="#a0cce0" stroke-width="1" opacity="0.6"/>
  <line x1="472" y1="310" x2="555" y2="310" stroke="#a0cce0" stroke-width="1" opacity="0.6"/>
  <!-- Sea label -->
  <text x="505" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a9ab5" opacity="0.7" font-style="italic" transform="rotate(-90,505,200)">Marea Neagra</text>

  <!-- Beach strip -->
  <rect x="442" y="0" width="18" height="380" fill="#e8d8a8"/>

  <!-- Street grid — horizontal -->
  <line x1="0"   y1="88"  x2="442" y2="88"  stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>
  <line x1="0"   y1="168" x2="442" y2="168" stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>
  <line x1="0"   y1="248" x2="442" y2="248" stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>
  <line x1="0"   y1="330" x2="442" y2="330" stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>

  <!-- Street grid — vertical -->
  <line x1="88"  y1="0" x2="88"  y2="380" stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>
  <line x1="178" y1="0" x2="178" y2="380" stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>
  <line x1="268" y1="0" x2="268" y2="380" stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>
  <line x1="368" y1="0" x2="368" y2="380" stroke="#ddd6c4" stroke-width="5" stroke-linecap="round"/>

  <!-- Strada Falezei (coastal road) — slightly wider -->
  <line x1="440" y1="0" x2="440" y2="380" stroke="#cec6b0" stroke-width="7" stroke-linecap="round"/>
  <text x="438" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a09880" transform="rotate(-90,438,190)" letter-spacing="1">STR. FALEZEI</text>

  <!-- Block fills (city blocks) — subtle -->
  <rect x="92"  y="92"  width="82"  height="72" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="92"  y="172" width="82"  height="72" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="92"  y="252" width="82"  height="74" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="182" y="92"  width="82"  height="72" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="182" y="172" width="82"  height="72" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="182" y="252" width="82"  height="74" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="272" y="92"  width="92"  height="72" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="272" y="172" width="92"  height="72" rx="2" fill="#e8e2d4" opacity="0.5"/>
  <rect x="272" y="252" width="92"  height="74" rx="2" fill="#e8e2d4" opacity="0.5"/>

  <!-- ROUTE — elegant dashed line with smooth corner -->
  <!-- Shadow/glow for route -->
  <path d="M 88,330 L 390,330 Q 440,330 440,278 L 440,68"
        fill="none" stroke="#2c4a7a" stroke-width="5" stroke-opacity="0.12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Route line -->
  <path d="M 88,330 L 390,330 Q 440,330 440,278 L 440,68"
        fill="none" stroke="#2c4a7a" stroke-width="2.5"
        stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Walking time badge on route -->
  <rect x="220" y="316" width="70" height="24" rx="12" fill="#2c4a7a"/>
  <text x="255" y="332" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="white" letter-spacing="0.5">~ 5 min</text>

  <!-- Casa Ciobi marker -->
  <circle cx="88" cy="330" r="10" fill="white" stroke="#2c4a7a" stroke-width="2"/>
  <circle cx="88" cy="330" r="4"  fill="#2c4a7a"/>
  <!-- Casa Ciobi label -->
  <rect x="18" y="344" width="82" height="22" rx="4" fill="white" fill-opacity="0.92"/>
  <text x="59" y="359" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c1a0e" font-weight="500">Casa Ciobi</text>

  <!-- Beach destination marker -->
  <circle cx="440" cy="68" r="10" fill="white" stroke="#c04020" stroke-width="2"/>
  <circle cx="440" cy="68" r="4"  fill="#c04020"/>
  <!-- Beach label -->
  <rect x="362" y="14" width="56" height="22" rx="4" fill="white" fill-opacity="0.92"/>
  <text x="390" y="29" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2c1a0e" font-weight="500">Plaja</text>

  <!-- Walk icon (simple figure) above time badge -->
  <text x="255" y="308" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c4a7a" opacity="0.7">🚶</text>

  <!-- North indicator -->
  <g transform="translate(520,340)">
    <circle cx="0" cy="0" r="14" fill="white" fill-opacity="0.8" stroke="#c8bea0" stroke-width="1"/>
    <text x="0" y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2e1e" font-weight="bold">N</text>
    <line x1="0" y1="-12" x2="0" y2="-6" stroke="#3a2e1e" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="0,-12 -3,-5 3,-5" fill="#3a2e1e"/>
  </g>

  <!-- Rounded frame -->
  <rect width="560" height="380" rx="24" fill="none" stroke="#c8bea0" stroke-width="2" opacity="0.6"/>
</svg>
