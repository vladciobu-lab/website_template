<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -50 1000 600" width="1000" height="600">
  <rect x="0" y="-8" width="860" height="516" fill="#f5f0e8"/>

  <!-- Floor tile grid - bedroom area -->
  <line x1="228" y1="150" x2="828" y2="150" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="228" y1="240" x2="828" y2="240" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="380" y1="22" x2="380" y2="308" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="530" y1="22" x2="530" y2="308" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="680" y1="22" x2="680" y2="308" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="228" y1="380" x2="828" y2="380" stroke="#c4b89a" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- Floor tile grid - BAIE -->
  <line x1="32" y1="170" x2="226" y2="170" stroke="#c4b89a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="32" y1="250" x2="226" y2="250" stroke="#c4b89a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="130" y1="22" x2="130" y2="306" stroke="#c4b89a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Outer wall -->
  <rect x="30" y="20" width="800" height="450" fill="none" stroke="#3a2e1e" stroke-width="5" stroke-linejoin="round"/>

  <!-- ===== WINDOW on bottom wall (right side) ===== -->
  <!-- Erase wall segment -->
  <rect x="582" y="463" width="180" height="14" fill="#f5f0e8"/>
  <!-- Window fill -->
  <rect x="582" y="455" width="180" height="22" fill="#ddeef5" stroke="#3a2e1e" stroke-width="2.5"/>
  <line x1="672" y1="455" x2="672" y2="477" stroke="#3a2e1e" stroke-width="1.5"/>
  <line x1="582" y1="466" x2="762" y2="466" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Window sill -->
  <rect x="572" y="452" width="200" height="9" fill="#e8dfc8" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- ===== INNER PARTITION WALLS (BAIE) ===== -->
  <!-- Vertical inner wall -->
  <line x1="228" y1="20" x2="228" y2="308" stroke="#3a2e1e" stroke-width="5"/>
  <!-- Horizontal inner wall - left segment (before door gap) -->
  <line x1="30" y1="308" x2="130" y2="308" stroke="#3a2e1e" stroke-width="5"/>
  <!-- Horizontal inner wall - right segment (after door gap) -->
  <line x1="228" y1="308" x2="228" y2="308" stroke="#3a2e1e" stroke-width="5"/>

  <!-- ===== BATHROOM DOOR (in horizontal interior wall, gap x=130 to x=228) ===== -->
  <!-- Erase wall for gap -->
  <rect x="132" y="303" width="94" height="12" fill="#f5f0e8"/>
  <!-- Dashed ghost line -->
  <line x1="130" y1="308" x2="228" y2="308" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.35"/>
  <!-- Arc opens downward into lower hallway space -->
  <path d="M228,308 A98,98 0 0,1 130,406" fill="none" stroke="#3a2e1e" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Knob -->
  <circle cx="220" cy="316" r="3.5" fill="#3a2e1e"/>

  <!-- ===== EXIT DOOR on bottom wall (center-left) ===== -->
  <!-- Erase wall for gap -->
  <rect x="352" y="463" width="100" height="14" fill="#f5f0e8"/>
  <!-- Dashed ghost line -->
  <line x1="352" y1="470" x2="452" y2="470" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.35"/>
  <!-- Arc opens inward (upward) -->
  <path d="M352,470 A100,100 0 0,1 452,370" fill="none" stroke="#3a2e1e" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Knob -->
  <circle cx="360" cy="378" r="3.5" fill="#3a2e1e"/>

  <!-- ===== BATHROOM FIXTURES ===== -->
  <!-- Toilet: against top wall, left side of BAIE -->
  <!-- Tank -->
  <rect x="38" y="28" width="60" height="26" rx="3" fill="#e8e8e0" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Bowl -->
  <ellipse cx="68" cy="104" rx="28" ry="22" fill="#e8e8e0" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Seat ring -->
  <ellipse cx="68" cy="104" rx="21" ry="16" fill="none" stroke="#3a2e1e" stroke-width="1" opacity="0.6"/>

  <!-- Sink: against interior horizontal wall, inside BAIE -->
  <rect x="50" y="246" width="108" height="56" rx="9" fill="#e8e8e0" stroke="#3a2e1e" stroke-width="1.5"/>
  <ellipse cx="104" cy="274" rx="23" ry="16" fill="none" stroke="#3a2e1e" stroke-width="1"/>
  <circle cx="104" cy="274" r="3.5" fill="none" stroke="#3a2e1e" stroke-width="1"/>
  <!-- Faucet -->
  <rect x="100" y="246" width="9" height="9" rx="1" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1"/>

  <!-- ===== BED LEFT (x: 237–487) ===== -->
  <!-- Headboard -->
  <rect x="237" y="26" width="248" height="36" rx="5" fill="#c4a87a" stroke="#3a2e1e" stroke-width="2.5"/>
  <line x1="262" y1="31" x2="262" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="302" y1="31" x2="302" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="342" y1="31" x2="342" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="382" y1="31" x2="382" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="422" y1="31" x2="422" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="462" y1="31" x2="462" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <!-- Bed frame -->
  <rect x="237" y="59" width="248" height="242" rx="7" fill="#e8dfc8" stroke="#3a2e1e" stroke-width="2.5"/>
  <!-- Bed legs -->
  <rect x="239" y="293" width="13" height="14" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1.5"/>
  <rect x="470" y="293" width="13" height="14" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Duvet -->
  <rect x="245" y="67" width="232" height="228" rx="6" fill="#f0ebe0" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Pillows -->
  <rect x="252" y="70" width="100" height="60" rx="9" fill="#fff9f0" stroke="#3a2e1e" stroke-width="2"/>
  <rect x="372" y="70" width="100" height="60" rx="9" fill="#fff9f0" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="302" y1="75" x2="302" y2="125" stroke="#ddd0bb" stroke-width="1"/>
  <line x1="422" y1="75" x2="422" y2="125" stroke="#ddd0bb" stroke-width="1"/>
  <!-- Duvet lines -->
  <path d="M245,148 Q361,140 477,148" fill="none" stroke="#3a2e1e" stroke-width="1.3" stroke-dasharray="5,3"/>
  <line x1="361" y1="148" x2="361" y2="292" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <line x1="245" y1="222" x2="477" y2="222" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>

  <!-- ===== NIGHTSTAND (between beds) ===== -->
  <rect x="500" y="78" width="78" height="92" rx="4" fill="#d4c8a8" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="500" y1="124" x2="578" y2="124" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="539" cy="101" r="5.5" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="539" cy="143" r="5.5" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Lamp -->
  <line x1="539" y1="78" x2="539" y2="52" stroke="#3a2e1e" stroke-width="2"/>
  <ellipse cx="539" cy="42" rx="26" ry="11" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M513,42 Q539,62 565,42" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- ===== BED RIGHT (x: 592–826) ===== -->
  <!-- Headboard -->
  <rect x="592" y="26" width="234" height="36" rx="5" fill="#c4a87a" stroke="#3a2e1e" stroke-width="2.5"/>
  <line x1="616" y1="31" x2="616" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="654" y1="31" x2="654" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="692" y1="31" x2="692" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="730" y1="31" x2="730" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="768" y1="31" x2="768" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="806" y1="31" x2="806" y2="57" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <!-- Bed frame -->
  <rect x="592" y="59" width="234" height="242" rx="7" fill="#e8dfc8" stroke="#3a2e1e" stroke-width="2.5"/>
  <!-- Bed legs -->
  <rect x="594" y="293" width="13" height="14" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1.5"/>
  <rect x="811" y="293" width="13" height="14" fill="#c4a87a" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Duvet -->
  <rect x="600" y="67" width="218" height="228" rx="6" fill="#f0ebe0" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Pillows -->
  <rect x="607" y="70" width="94" height="60" rx="9" fill="#fff9f0" stroke="#3a2e1e" stroke-width="2"/>
  <rect x="718" y="70" width="94" height="60" rx="9" fill="#fff9f0" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="654" y1="75" x2="654" y2="125" stroke="#ddd0bb" stroke-width="1"/>
  <line x1="765" y1="75" x2="765" y2="125" stroke="#ddd0bb" stroke-width="1"/>
  <!-- Duvet lines -->
  <path d="M600,148 Q709,140 818,148" fill="none" stroke="#3a2e1e" stroke-width="1.3" stroke-dasharray="5,3"/>
  <line x1="709" y1="148" x2="709" y2="292" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <line x1="600" y1="222" x2="818" y2="222" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>

  <!-- Door arc right wall -->
  <path d="M830,240 Q830,308 772,308" fill="none" stroke="#3a2e1e" stroke-width="1.8" stroke-dasharray="4,3"/>
  <circle cx="828" cy="275" r="3.5" fill="#3a2e1e"/>

  <!-- Sketch texture strokes -->
  <line x1="32" y1="22" x2="34" y2="468" stroke="#3a2e1e" stroke-width="1.5" opacity="0.3"/>
  <line x1="828" y1="22" x2="826" y2="468" stroke="#3a2e1e" stroke-width="1.5" opacity="0.3"/>
</svg>
