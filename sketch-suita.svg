  <rect x="530" y="60" width="140" height="8" fill="#ddeef5" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="600" y1="60" x2="600" y2="68" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- Bed right room -->
  <rect x="505" y="110" width="200" height="280" rx="6" fill="#e8dfc8" stroke="#3a2e1e" stroke-width="2.5"/>
  <!-- Headboard -->
  <rect x="505" y="100" width="200" height="32" rx="5" fill="#c4a87a" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="530" y1="105" x2="530" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="562" y1="105" x2="562" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="594" y1="105" x2="594" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="620" y1="105" x2="620" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="652" y1="105" x2="652" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="680" y1="105" x2="680" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <!-- Duvet -->
  <rect x="513" y="118" width="184" height="265" rx="5" fill="#f0ebe0" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M513,185 Q605,176 697,185" fill="none" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="575" y1="185" x2="575" y2="378" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <line x1="637" y1="185" x2="637" y2="378" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <line x1="513" y1="280" x2="697" y2="280" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <!-- Pillows -->
  <rect x="518" y="118" width="78" height="60" rx="8" fill="#fff9f0" stroke="#3a2e1e" stroke-width="1.5"/>
  <rect x="611" y="118" width="78" height="60" rx="8" fill="#fff9f0" stroke="#3a2e1e" stroke-width="1.5"/>
  <line x1="557" y1="122" x2="557" y2="173" stroke="#ddd0bb" stroke-width="1"/>
  <line x1="650" y1="122" x2="650" y2="173" stroke="#ddd0bb" stroke-width="1"/>

  <!-- Nightstand right room -->
  <rect x="426" y="130" width="58" height="75" rx="4" fill="#d4c8a8" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="426" y1="167" x2="484" y2="167" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="455" cy="149" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="455" cy="184" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <line x1="455" y1="130" x2="455" y2="104" stroke="#3a2e1e" stroke-width="1.5"/>
  <ellipse cx="455" cy="96" rx="22" ry="9" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M433,96 Q455,114 477,96" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- Room label right -->
  <text x="575" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a2e1e" opacity="0.6" font-style="italic">Camera 2</text>

  <!-- Main label -->
  <text x="400" y="556" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3a2e1e" opacity="0.7" font-style="italic">Suită Familială — 2 camere comunicante — 20 m²</text>
</svg>
