<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f5f0e8"/>

  <!-- ===== ROOM LEFT (x: 60–390) ===== -->
  <!-- Walls -->
  <rect x="60" y="60" width="330" height="460" fill="none" stroke="#3a2e1e" stroke-width="4"/>

  <!-- Floor texture left -->
  <line x1="60" y1="120" x2="390" y2="120" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="60" y1="180" x2="390" y2="180" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="60" y1="240" x2="390" y2="240" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="60" y1="300" x2="390" y2="300" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="60" y1="360" x2="390" y2="360" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="60" y1="420" x2="390" y2="420" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>

  <!-- Door left room — bottom wall, left side -->
  <!-- door gap in wall -->
  <rect x="60" y="455" width="4" height="65" fill="#f5f0e8"/>
  <line x1="60" y1="60" x2="60" y2="455" stroke="#3a2e1e" stroke-width="4"/>
  <line x1="60" y1="520" x2="60" y2="520" stroke="#3a2e1e" stroke-width="4"/>
  <!-- bottom wall left of door -->
  <line x1="60" y1="520" x2="150" y2="520" stroke="#3a2e1e" stroke-width="4"/>
  <!-- bottom wall right of door -->
  <line x1="230" y1="520" x2="390" y2="520" stroke="#3a2e1e" stroke-width="4"/>
  <!-- door arc -->
  <path d="M150,520 Q150,440 230,440" fill="none" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150" y1="520" x2="150" y2="440" stroke="#3a2e1e" stroke-width="2"/>
  <!-- door knob -->
  <circle cx="225" cy="448" r="4" fill="#3a2e1e"/>

  <!-- Window left room — top wall -->
  <rect x="130" y="60" width="140" height="8" fill="#ddeef5" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="200" y1="60" x2="200" y2="68" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- Bed left room -->
  <rect x="95" y="110" width="200" height="280" rx="6" fill="#e8dfc8" stroke="#3a2e1e" stroke-width="2.5"/>
