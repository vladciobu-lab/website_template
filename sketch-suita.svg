  <rect x="95" y="100" width="200" height="32" rx="5" fill="#c4a87a" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="120" y1="105" x2="120" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="152" y1="105" x2="152" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="184" y1="105" x2="184" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="210" y1="105" x2="210" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="242" y1="105" x2="242" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <line x1="270" y1="105" x2="270" y2="127" stroke="#3a2e1e" stroke-width="1" opacity="0.4"/>
  <!-- Duvet -->
  <rect x="103" y="118" width="184" height="265" rx="5" fill="#f0ebe0" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M103,185 Q195,176 287,185" fill="none" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="165" y1="185" x2="165" y2="378" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <line x1="227" y1="185" x2="227" y2="378" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
  <line x1="103" y1="280" x2="287" y2="280" stroke="#c4b89a" stroke-width="1" opacity="0.6"/>
