  <rect x="201" y="118" width="78" height="60" rx="8" fill="#fff9f0" stroke="#3a2e1e" stroke-width="1.5"/>
  <line x1="147" y1="122" x2="147" y2="173" stroke="#ddd0bb" stroke-width="1"/>
  <line x1="240" y1="122" x2="240" y2="173" stroke="#ddd0bb" stroke-width="1"/>

  <!-- Nightstand left room -->
  <rect x="316" y="130" width="58" height="75" rx="4" fill="#d4c8a8" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="316" y1="167" x2="374" y2="167" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="345" cy="149" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <circle cx="345" cy="184" r="4" fill="none" stroke="#3a2e1e" stroke-width="1.5"/>
  <!-- Lamp -->
  <line x1="345" y1="130" x2="345" y2="104" stroke="#3a2e1e" stroke-width="1.5"/>
  <ellipse cx="345" cy="96" rx="22" ry="9" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>
  <path d="M323,96 Q345,114 367,96" fill="#f5e8c0" stroke="#3a2e1e" stroke-width="1.5"/>

  <!-- Room label left -->
  <text x="225" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a2e1e" opacity="0.6" font-style="italic">Camera 1</text>

  <!-- ===== SHARED WALL (x: 390–410) ===== -->
  <rect x="390" y="60" width="20" height="460" fill="#d4c4a0" stroke="#3a2e1e" stroke-width="2"/>
  <!-- Communicating door gap in shared wall -->
  <rect x="390" y="255" width="20" height="90" fill="#f5f0e8"/>
  <!-- Door frame lines -->
  <line x1="390" y1="60" x2="390" y2="255" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="390" y1="345" x2="390" y2="520" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="410" y1="60" x2="410" y2="255" stroke="#3a2e1e" stroke-width="2"/>
  <line x1="410" y1="345" x2="410" y2="520" stroke="#3a2e1e" stroke-width="2"/>
  <!-- Communicating door arc (opens left) -->
  <path d="M390,255 Q330,255 330,345" fill="none" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="390" y1="255" x2="330" y2="255" stroke="#3a2e1e" stroke-width="2"/>
  <!-- Communicating door arc (opens right) -->
  <path d="M410,255 Q470,255 470,345" fill="none" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="410" y1="255" x2="470" y2="255" stroke="#3a2e1e" stroke-width="2"/>
  <!-- Knobs -->
  <circle cx="336" cy="260" r="3.5" fill="#3a2e1e"/>
  <circle cx="464" cy="260" r="3.5" fill="#3a2e1e"/>
  <!-- Label -->
  <text x="400" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2e1e" opacity="0.7" transform="rotate(90,400,300)">usa comunicare</text>

  <!-- ===== ROOM RIGHT (x: 410–740) ===== -->
  <!-- Walls -->
  <rect x="410" y="60" width="330" height="460" fill="none" stroke="#3a2e1e" stroke-width="4"/>

  <!-- Floor texture right -->
  <line x1="410" y1="120" x2="740" y2="120" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="410" y1="180" x2="740" y2="180" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="410" y1="240" x2="740" y2="240" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="410" y1="300" x2="740" y2="300" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="410" y1="360" x2="740" y2="360" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>
  <line x1="410" y1="420" x2="740" y2="420" stroke="#c4b89a" stroke-width="1" stroke-dasharray="5,6"/>

  <!-- Door right room — bottom wall, right side -->
  <line x1="740" y1="60" x2="740" y2="520" stroke="#3a2e1e" stroke-width="4"/>
  <line x1="410" y1="520" x2="570" y2="520" stroke="#3a2e1e" stroke-width="4"/>
  <line x1="650" y1="520" x2="740" y2="520" stroke="#3a2e1e" stroke-width="4"/>
  <path d="M650,520 Q650,440 570,440" fill="none" stroke="#3a2e1e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="650" y1="520" x2="650" y2="440" stroke="#3a2e1e" stroke-width="2"/>
  <circle cx="575" cy="448" r="4" fill="#3a2e1e"/>

